<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none'">
  <!-- GitHub Pages serves this page for any missing path under the site, at any depth, so relative
       links need a fixed base: the project site's path. -->
  <base href="/Courier/">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Page not found · Courier</title>
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="Courier home">
        <img src="images/icon.svg" width="36" height="36" alt="">
        <span>Courier</span>
      </a>
    </div>
  </header>
  <main id="main" class="container not-found">
    <div>
      <img class="hero-mark" src="images/icon.svg" width="96" height="96" alt="">
      <h1>This delivery went to the wrong address</h1>
      <p>The page you asked for does not exist.</p>
      <div class="cta-row">
        <a class="btn btn-primary btn-large" href="./">Go to the home page</a>
        <a class="btn btn-secondary btn-large" href="https://github.com/cguldogan/Courier">View on GitHub</a>
      </div>
    </div>
  </main>
</body>
</html>
