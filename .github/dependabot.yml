version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Minor and patch updates arrive as two grouped PRs (runtime and development dependencies);
    # major updates (Electron, Vite, TypeScript, …) come one PR each.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # The Node.js base image of the command-line container (Dockerfile), pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Digest updates only; a move to another Node.js major is a deliberate change.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
