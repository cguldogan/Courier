# Packages Courier for every OS and arch on native runners, smoke-tests each package on the runner
# that built it, and uploads the installers as workflow artifacts. A `v*` tag also drafts a GitHub
# release with all installers and a SHA256SUMS file. Builds are unsigned (see README, "Building and
# releases"). Nothing is published by electron-builder.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded main builds are cancelled; tag builds always finish.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  npm_config_fund: 'false'
  npm_config_audit: 'false'

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac, arch: arm64, os: macos-15 }
          - { platform: mac, arch: x64, os: macos-15-intel }
          - { platform: win, arch: x64, os: windows-2025 }
          - { platform: win, arch: arm64, os: windows-11-arm }
          - { platform: linux, arch: x64, os: ubuntu-24.04 }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install packaging tools, Electron runtime libraries and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xvfb xauth \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libnotify4 libsecret-1-0

      - name: Package
        run: npx electron-builder "--$PLATFORM" "--$ARCH" --publish never
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}

      - name: Smoke-test the package (bundled CLI and app window)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node e2e/smoke-packaged.mjs --arch "$ARCH"
          else
            node e2e/smoke-packaged.mjs --arch "$ARCH"
          fi
        env:
          ARCH: ${{ matrix.arch }}

      - name: List artifacts
        run: ls -la release

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: courier-${{ matrix.platform }}-${{ matrix.arch }}
          # Installers and archives only (no blockmaps or electron-builder debug files).
          path: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 30
          # dmg/zip/exe/AppImage/deb/tar.gz are already compressed.
          compression-level: 0

  release:
    name: Draft release
    needs: package
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: courier-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the files of the existing (draft) release.
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "Courier $TAG" "${prerelease[@]}"
          fi
