# Container image of the command-line runner (Dockerfile) on the GitHub Container Registry:
# ghcr.io/<owner>/courier for linux/amd64 and linux/arm64.
#
# - Pull requests: build and smoke-test only (no login, no push).
# - `v*` tags: push X.Y.Z, X.Y and latest (a pre-release tag such as v0.2.0-beta.1 pushes only its
#   own version tag), with a signed build provenance attestation.
# - Manual run from main: push `edge`. From another branch: build and smoke-test only.
#
# Every image is first built and smoke-tested natively on an x64 and an arm64 runner
# (e2e/container-smoke.mjs). The publish job then builds both platforms from the same commit,
# smoke-tests its own linux/amd64 build again, and pushes both in one buildx call that reuses that
# build's cache. The Dockerfile needs no emulation: its build stage runs on the build machine's
# platform (shared by both targets) and the runtime stage only copies files.
name: Container

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - src/**
      - package.json
      - package-lock.json
      - cli.vite.config.mts
      - tsconfig.json
      - e2e/container-smoke.mjs
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request and manual runs are cancelled; tag runs always finish.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: test-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (runs the smoke test)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Expected version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out directory, not the Git context (which would hand the token to BuildKit).
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          push: false
          tags: courier-smoke:${{ matrix.arch }}

      - name: Smoke test
        run: node e2e/container-smoke.mjs "courier-smoke:$ARCH" --expect-version "$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}

  publish:
    name: publish
    needs: test
    # Tag pushes, and manual runs from main (`on: push` only has tags).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Build provenance attestation (Sigstore certificate and the attestations API).
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and version
        id: image
        run: |
          # Registry names must be lowercase; the owner name may not be.
          echo "name=ghcr.io/${OWNER,,}/courier" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotations on the image index too: GitHub shows a multi-arch package's description from there.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Courier CLI
            org.opencontainers.image.description=Courier command-line runner: run Courier and Postman collections (console, JSON and JUnit reports) and serve saved examples with courier mock
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=Courier CLI
            org.opencontainers.image.description=Courier command-line runner: run Courier and Postman collections (console, JSON and JUnit reports) and serve saved examples with courier mock
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Node.js (runs the smoke test)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.image.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: courier-smoke:publish

      - name: Smoke test
        run: node e2e/container-smoke.mjs courier-smoke:publish --expect-version "$VERSION"
        env:
          VERSION: ${{ steps.image.outputs.version }}

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.image.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance comes from the GitHub attestation below; BuildKit's own would show up as an
          # "unknown/unknown" platform on the package page.
          provenance: false
          sbom: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
